name: Documentation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate circuit evidence
        run: pnpm circuit:check

      - name: Check documentation
        run: pnpm check

      - name: Build documentation site
        run: pnpm build

      - name: Check built site
        run: pnpm check:site

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned numerical test dependencies
        run: python -m pip install -r scripts/pcbgen/numerical-requirements.txt

      - name: Run Python unit tests
        run: bash scripts/checks/run-python-tests.sh

      - name: Run native main-ground connectivity regression
        run: bash scripts/kicad/run.sh python3 scripts/pcbgen/power_locality_native_regression.py

  # KiCad checks will be added by sub-issue #44.
