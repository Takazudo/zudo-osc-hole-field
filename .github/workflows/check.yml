name: Documentation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: issue189-core-audit-task-pilot
  cancel-in-progress: false

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate circuit evidence
        run: pnpm circuit:check

      - name: Check documentation
        run: pnpm check

      - name: Build documentation site
        run: pnpm build

      - name: Check built site
        run: pnpm check:site

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js for panel regeneration
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned numerical test dependencies
        run: python -m pip install -r scripts/pcbgen/numerical-requirements.txt

      - name: Run Python unit tests
        run: bash scripts/checks/run-python-tests.sh

      - name: Check current shortlist capture and pin evidence
        run: python3 scripts/libgen/fixtures/check_ic_evidence.py

      - name: Check explicit catalogue publication coverage
        run: python3 scripts/checks/check_catalogue_publication.py

      - name: Run admitted native Python checks
        id: aggregate
        env:
          EPIC242_PARENT_ADMISSION_RUN_ID: ${{ vars.EPIC242_PARENT_ADMISSION_RUN_ID }}
          EPIC242_PARENT_ADMISSION_SHA: ${{ vars.EPIC242_PARENT_ADMISSION_SHA }}
          EPIC242_REVIEWED_HOOK_SHA256: ${{ vars.EPIC242_REVIEWED_HOOK_SHA256 }}
        run: |
          if python3 scripts/kicad/ci_native_admission.py --phase python --seconds 1680 \
            --evidence "$RUNNER_TEMP/epic242-python-evidence.json" -- \
            bash scripts/checks/run-ci-native-python.sh; then
            exit 0
          else
            native_status=$?
            git diff --binary > "$RUNNER_TEMP/osc-regeneration.patch"
            git diff --stat
            exit "$native_status"
          fi

      - name: Retain regeneration drift for review
        if: failure() && steps.aggregate.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-regeneration-diff
          path: ${{ runner.temp }}/osc-regeneration.patch
          if-no-files-found: error
          retention-days: 7

      - name: Retain native resource evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: epic242-python-resource-evidence
          path: ${{ runner.temp }}/epic242-python-evidence.json
          if-no-files-found: ignore
          retention-days: 7

  # Complete native assembly checks remain gated by sub-issue #44.

  board-drc:
    needs: python-tests
    if: ${{ always() }}
    name: Native DRC gate (${{ matrix.board }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        board: [osc-jack-left, osc-jack-right, osc-core]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Partially routed drafts: unconnected items are reported, DRC errors and schematic parity fail.
      - name: Run admitted pinned KiCad DRC with schematic parity and zone refill
        env:
          BOARD: ${{ matrix.board }}
          EPIC242_PARENT_ADMISSION_RUN_ID: ${{ vars.EPIC242_PARENT_ADMISSION_RUN_ID }}
          EPIC242_PARENT_ADMISSION_SHA: ${{ vars.EPIC242_PARENT_ADMISSION_SHA }}
          EPIC242_REVIEWED_HOOK_SHA256: ${{ vars.EPIC242_REVIEWED_HOOK_SHA256 }}
        run: |
          python3 scripts/kicad/ci_native_admission.py --phase board --board "$BOARD" \
            --seconds 2580 --evidence "$RUNNER_TEMP/epic242-$BOARD-evidence.json" -- \
            bash scripts/checks/run-ci-native-board.sh "$BOARD"

      - name: Retain native resource evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: epic242-${{ matrix.board }}-resource-evidence
          path: ${{ runner.temp }}/epic242-${{ matrix.board }}-evidence.json
          if-no-files-found: ignore
          retention-days: 7
