name: Documentation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate circuit evidence
        run: pnpm circuit:check

      - name: Check documentation
        run: pnpm check

      - name: Build documentation site
        run: pnpm build

      - name: Check built site
        run: pnpm check:site

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js for panel regeneration
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned numerical test dependencies
        run: python -m pip install -r scripts/pcbgen/numerical-requirements.txt

      - name: Run Python unit tests
        run: bash scripts/checks/run-python-tests.sh

      - name: Run native main-ground connectivity regression
        run: bash scripts/kicad/run.sh python3 scripts/pcbgen/power_locality_native_regression.py

      - name: Check update-in-place PCB sync
        run: bash scripts/pcbgen/test_fixture.sh

      - name: Run native monitor/permit candidate checks
        run: python3 scripts/checks/monitor_permit_native.py --check

      - name: Run native passive permit RC diagnostics
        run: python3 scripts/checks/monitor_permit_rc.py --check

      - name: Run native source courtyard minimum check
        run: bash scripts/kicad/run.sh python3 scripts/libgen/fixtures/check_courtyard_minimum.py

      - name: Run native IC display-envelope placement checks
        run: bash scripts/kicad/run.sh python3 scripts/libgen/fixtures/check_wrl_dimensions.py --check

      - name: Check aggregate source regeneration
        id: aggregate
        run: |
          if bash scripts/checks/regen-all.sh --check; then
            exit 0
          else
            regen_status=$?
            git diff --binary > "$RUNNER_TEMP/osc-regeneration.patch"
            git diff --stat
            exit "$regen_status"
          fi

      - name: Retain regeneration drift for review
        if: failure() && steps.aggregate.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-regeneration-diff
          path: ${{ runner.temp }}/osc-regeneration.patch
          if-no-files-found: error
          retention-days: 7

  # Complete native assembly checks remain gated by sub-issue #44.
