{
  "name": "OSC frozen-source candidate infrastructure smoke",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "mode": {
          "description": "Public frozen source only: smoke, identity or public topology observations (not acceptance)",
          "type": "choice",
          "required": true,
          "default": "smoke",
          "options": [
            "smoke",
            "identity",
            "topology"
          ]
        },
        "source_tests_only": {
          "description": "Run source tests only; skip frozen checkout and all native/container execution",
          "type": "boolean",
          "required": true,
          "default": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "osc-smoke-fa16c6ffa6497f095e1902c223150c23fafccd6e",
    "cancel-in-progress": false
  },
  "jobs": {
    "frozen-source-smoke": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "env": {
        "TOOLING_SHA": "${{ github.workflow_sha }}",
        "PYTHONDONTWRITEBYTECODE": "1",
        "OMP_NUM_THREADS": "1",
        "OPENBLAS_NUM_THREADS": "1",
        "OSC_MODE": "${{ inputs.mode }}",
        "SOURCE_TESTS_ONLY": "${{ inputs.source_tests_only }}"
      },
      "steps": [
        {
          "name": "Initialize small failure receipt",
          "timeout-minutes": 1,
          "run": "mkdir -p receipts\nprintf '%s\\n' '{\"status\":\"SETUP_INCOMPLETE\",\"candidate_ingestion\":\"UNIMPLEMENTED\"}' > receipts/receipt.json"
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "timeout-minutes": 2,
          "with": {
            "ref": "${{ github.workflow_sha }}",
            "path": "tooling",
            "persist-credentials": false,
            "sparse-checkout-cone-mode": false,
            "sparse-checkout": "/scripts/ci/osc_candidate_check.py\n/scripts/ci/test_osc_candidate_check.py\n/.github/workflows/osc-candidate-check.yml\n/scripts/ci/osc_frozen_board_inventory.py\n/scripts/ci/osc_inventory_check.py\n/scripts/ci/test_osc_inventory_check.py\n/scripts/ci/test_osc_inventory_workflow.py\n/scripts/ci/osc_topology_check.py\n/scripts/ci/osc_frozen_topology.py\n/scripts/ci/test_osc_topology.py\n/scripts/ci/test_osc_mismatch.py"
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "timeout-minutes": 2,
          "with": {
            "ref": "fa16c6ffa6497f095e1902c223150c23fafccd6e",
            "path": "frozen",
            "persist-credentials": false,
            "sparse-checkout-cone-mode": false,
            "sparse-checkout": "/scripts/kicad/run.sh\n/scripts/kicad/pin.env\n/package.json\n${{ (inputs.mode == 'identity' || inputs.mode == 'topology') && '/boards/osc-core/osc-core.kicad_pcb' || '' }}"
          },
          "if": "${{ !inputs.source_tests_only }}"
        },
        {
          "name": "Pure tests",
          "timeout-minutes": 2,
          "run": "python3 - <<'PY'\nimport hashlib,json,os,sys\nfrom pathlib import Path\nsys.path.insert(0,'tooling/scripts/ci')\nfrom osc_candidate_check import run_command\nrows=[]\nfor flags in ([],['-O']):\n    r=run_command(['python3','-B',*flags,'-m','unittest','discover','-s','scripts/ci','-p','test_osc*.py','-v'],Path('tooling').resolve(),30)\n    print(r['output'],flush=True)\n    rows.append(r)\n    Path('receipts/tests.json').write_text(json.dumps(rows,indent=2))\n    if r['failure'] or r['exit_code']: raise SystemExit(1)\nif os.environ.get('SOURCE_TESTS_ONLY')=='true':\n    root=Path('tooling')\n    paths=sorted(root.glob('scripts/ci/*.py'))+[root/'.github/workflows/osc-candidate-check.yml']\n    hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}\n    Path('receipts/receipt.json').write_text(json.dumps({'status':'SOURCE_TESTS_ONLY_PASSED',\n        'tooling_sha':os.environ['TOOLING_SHA'],'source_sha':'fa16c6ffa6497f095e1902c223150c23fafccd6e',\n        'source_checkout_executed':False,'native_executed':False,'candidate_ingestion':'UNIMPLEMENTED',\n        'tooling_hashes':hashes},indent=2))\nPY"
        },
        {
          "name": "Run selected frozen-source mode",
          "timeout-minutes": 9,
          "run": "case \"$OSC_MODE\" in\n  smoke) python3 -B tooling/scripts/ci/osc_candidate_check.py --source frozen --out receipts ;;\n  identity) python3 -B tooling/scripts/ci/osc_inventory_check.py frozen inventory-receipts ;;\n  topology) python3 -B tooling/scripts/ci/osc_topology_check.py frozen topology-receipts ;;\n  *) echo \"Unsupported mode\" >&2; exit 2 ;;\nesac",
          "if": "${{ !inputs.source_tests_only }}"
        },
        {
          "name": "Bound upload to explicit small artifacts",
          "if": "always()",
          "timeout-minutes": 1,
          "run": "python3 - <<'PY'\nimport json,os\nfrom pathlib import Path\ndst=Path('upload-safe'); dst.mkdir(exist_ok=False)\ntry:\n    mode=os.environ['OSC_MODE']\n    if mode not in ('smoke','identity','topology'): raise ValueError('invalid mode')\n    sources=[(Path('receipts'),{'receipt.json','tests.json'})]\n    inv=Path('inventory-receipts')\n    if inv.exists():\n        if mode!='identity' or inv.is_symlink() or not inv.is_dir(): raise ValueError('unexpected inventory output')\n        sources.append((inv,{'receipt.json','inventory.json'}))\n    top=Path('topology-receipts')\n    if top.exists():\n        if mode!='topology' or top.is_symlink() or not top.is_dir(): raise ValueError('unexpected topology output')\n        sources.append((top,{'receipt.json','topology.json'}))\n    total=0; payload={}\n    for src,allowed in sources:\n        if src.is_symlink() or not src.is_dir(): raise ValueError('invalid artifact root')\n        entries=list(src.iterdir())\n        if any(p.name not in allowed or p.is_symlink() or not p.is_file() for p in entries): raise ValueError('artifact allowlist/type violation')\n        if not (src/'receipt.json').is_file(): raise ValueError('missing failure receipt')\n        for p in entries:\n            with p.open('rb') as f: data=f.read(100*1024*1024+1)\n            total+=len(data)\n            if total>100*1024*1024: raise ValueError('artifact byte cap exceeded')\n            payload[p.name]=data\n    for name,data in payload.items(): (dst/name).write_bytes(data)\nexcept Exception as exc:\n    (dst/'receipt.json').write_text(json.dumps({'status':'ARTIFACT_POLICY_FAILURE','error':str(exc)}))\n    raise SystemExit(1)\nPY"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "timeout-minutes": 2,
          "with": {
            "name": "osc-${{ inputs.mode }}-fa16c6f-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "upload-safe/receipt.json\nupload-safe/tests.json\nupload-safe/inventory.json\nupload-safe/topology.json",
            "retention-days": 7,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
