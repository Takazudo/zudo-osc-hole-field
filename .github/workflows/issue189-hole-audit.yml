name: Issue189 native hole identity audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: obstacle-adoption-osc-core-37950004600
          run-id: 37950004600
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .circuit-cache/hole-audit-input
      - name: Verify immutable native inputs
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('.circuit-cache/hole-audit-input/.circuit-cache')
          for stage,expected in [('start','95c815b2178511621f97cd7021938023b96d4ee19c9282ae99b35fb387ba10c5'),('merge','b9f5ca13f83c7ffdbe5836fd271e7c1099e04b901ca1798a7be06f025bd02d66')]:
              p=root/('osc-core-grid-shards-'+stage)/'osc-core.kicad_pcb'
              assert hashlib.sha256(p.read_bytes()).hexdigest()==expected
          PY
      - name: Audit every potentially violating hole pair with pinned native fixtures
        run: |
          set -euo pipefail
          for stage in start merge; do
            bash scripts/kicad/run.sh python3 scripts/pcbgen/audit_hole_pairs.py \
              ".circuit-cache/hole-audit-input/.circuit-cache/osc-core-grid-shards-$stage/osc-core.kicad_pcb" \
              ".circuit-cache/hole-audit-$stage"
          done
      - name: Compare full identity sets and cross-check original native reports
        run: |
          python3 scripts/pcbgen/compare_hole_audits.py \
            .circuit-cache/hole-audit-start/result.json \
            .circuit-cache/hole-audit-merge/result.json \
            .circuit-cache/hole-audit-input/.circuit-cache/osc-core-grid-shards-start/drc.json \
            .circuit-cache/hole-audit-input/.circuit-cache/osc-core-grid-shards-merge/drc.json \
            .circuit-cache/hole-audit-comparison.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue189-hole-audit-${{ github.run_id }}
          path: .circuit-cache/hole-audit-*
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
