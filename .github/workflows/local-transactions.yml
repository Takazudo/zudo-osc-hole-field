name: Local board transactions
run-name: OSC4 transactions ${{ inputs.boards }} on ${{ inputs.branch }}

# One job per board runs the planned bounded OSC4 transaction
# (circuit/reviews/osc4-local-transactions-20261107/transaction.py) from the
# branch's current commit. The driver never promotes; this workflow never commits
# or pushes. Receipts, the copper delta, the checked candidate workspaces and logs
# come back as artifacts with a sha256 manifest. Draft only: qualification NOT RUN.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Existing branch to read the boards and the OSC4 plan from
        required: true
        type: string
      boards:
        description: Comma-separated boards (osc-core, osc-jack-left, osc-jack-right)
        required: false
        default: osc-core,osc-jack-left,osc-jack-right
        type: string
      max_minutes:
        description: Wall-clock budget per transaction in minutes (1-80). Empty = per-board default, 80 for osc-core and 60 for the jacks
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: local-transactions-${{ inputs.branch }}
  cancel-in-progress: false

env:
  BRANCH: ${{ inputs.branch }}
  BOARDS: ${{ inputs.boards }}
  MAX_MINUTES: ${{ inputs.max_minutes }}
  PLAN_DIR: circuit/reviews/osc4-local-transactions-20261107
  # Largest total of candidate workspace files copied into one artifact; larger files are listed, not uploaded.
  WORKSPACE_BUDGET_MB: "400"
  # Time budget (minutes). The per-board default comes from $PLAN_DIR/budgets.json on the plan commit (the
  # driver reads the same file). The driver stops itself at max_minutes (receipt TIMED OUT); the timeout
  # wrapper sends TERM WRAPPER_GRACE later and KILL KILL_AFTER after that; setup, collection and upload take
  # the rest. Their sum must stay within the transaction job's timeout-minutes (100), which `prepare` checks.
  WRAPPER_GRACE_MINUTES: "3"
  KILL_AFTER_MINUTES: "2"
  SETUP_ALLOWANCE_MINUTES: "10"
  JOB_TIMEOUT_MINUTES: "100"

jobs:
  prepare:
    name: Pin the plan commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      matrix: ${{ steps.pin.outputs.matrix }}
    steps:
      - name: Validate inputs and resolve the branch
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail  # a 404 from gh api must not be hidden by base64 -d succeeding on empty input
          git check-ref-format --branch "$BRANCH" >/dev/null
          # No leading zero: bash reads "0100" as octal while timeout reads it as 100 minutes.
          if [[ -n $MAX_MINUTES ]] && { ! [[ $MAX_MINUTES =~ ^[1-9][0-9]?$ ]] || ((10#$MAX_MINUTES > 80)); }; then echo "max_minutes must be empty or 1-80 without a leading zero"; exit 1; fi
          boards=()
          IFS=',' read -ra requested <<<"$BOARDS"
          for b in "${requested[@]}"; do
            b=${b//[[:space:]]/}
            [[ -z $b ]] && continue
            [[ $b =~ ^(osc-core|osc-jack-left|osc-jack-right)$ ]] || { echo "unknown board: $b"; exit 1; }
            boards+=("$b")
          done
          ((${#boards[@]})) || { echo "no board selected"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)
          if [[ -z $MAX_MINUTES ]]; then
            # Single budget source: the plan commit's budgets.json, which transaction.py reads too.
            budgets_json=$(gh api "repos/$GITHUB_REPOSITORY/contents/$PLAN_DIR/budgets.json?ref=$sha" --jq .content | base64 -d) \
              || { echo "::error::$BRANCH has no $PLAN_DIR/budgets.json; pass max_minutes explicitly"; exit 1; }
          fi
          # Every selected board must fit the job: budget + wrapper grace + kill-after + setup/collection allowance <= job timeout.
          budgets=()
          for b in "${boards[@]}"; do
            if [[ -n $MAX_MINUTES ]]; then eff=$MAX_MINUTES; else
              eff=$(jq -er --arg b "$b" '.minutes[$b]' <<<"$budgets_json") || { echo "::error::budgets.json has no entry for $b"; exit 1; }
              [[ $eff =~ ^[1-9][0-9]?$ ]] || { echo "::error::budgets.json minutes for $b must be 1-99: $eff"; exit 1; }
            fi
            total=$((eff + WRAPPER_GRACE_MINUTES + KILL_AFTER_MINUTES + SETUP_ALLOWANCE_MINUTES))
            if ((total > JOB_TIMEOUT_MINUTES)); then
              echo "::error::$b: budget ${eff} min + ${WRAPPER_GRACE_MINUTES} wrapper grace + ${KILL_AFTER_MINUTES} kill-after + ${SETUP_ALLOWANCE_MINUTES} setup allowance = ${total} min exceeds the ${JOB_TIMEOUT_MINUTES}-minute job timeout; lower max_minutes"
              exit 1
            fi
            budgets+=("$b=${eff}")
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "matrix=$(printf '%s\n' "${boards[@]}" | sort -u | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "Plan branch $BRANCH at $sha; boards: ${boards[*]}; budgets (min): ${budgets[*]}; wrapper TERM +${WRAPPER_GRACE_MINUTES} min, KILL +${KILL_AFTER_MINUTES} min" >> "$GITHUB_STEP_SUMMARY"

  transaction:
    name: Transaction ${{ matrix.board }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      BOARD: ${{ matrix.board }}
      SHA: ${{ needs.prepare.outputs.sha }}
      # Stamped into the receipt by the driver and verified by the collect step, so only this run's receipt is uploaded.
      INVOCATION: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.board }}
    steps:
      - name: Check out the plan commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Check the plan against the checked-out board
        id: precheck
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "$SHA" > "$RUNNER_TEMP/out/source-sha.txt"
          [[ -f $PLAN_DIR/transaction.py && -f $PLAN_DIR/transactions.json ]] || { echo "::error::$BRANCH has no OSC4 plan in $PLAN_DIR"; exit 1; }
          # Host-only: runs before the numerical install, the KiCad pull and the A* build.
          set +e
          python - <<'EOF' > "$RUNNER_TEMP/out/precheck.txt"
          import hashlib,json,os,sys
          board=os.environ['BOARD'];plan=json.load(open(os.path.join(os.environ['PLAN_DIR'],'transactions.json')))['transactions'][board]
          actual=hashlib.sha256(open(plan['input_board'],'rb').read()).hexdigest()
          spec=(plan['transaction'] or {}).get('spec',{}).get('name','')
          print(f"spec={spec}");print(f"plan_input_sha256={plan['input_board_sha256']}");print(f"board_sha256={actual}")
          print('result='+('match' if actual==plan['input_board_sha256'] and spec else 'MISMATCH'))
          EOF
          python -u "$PLAN_DIR/transaction.py" "$BOARD" --validate > "$RUNNER_TEMP/out/validate.json"
          validate=$?
          set -e
          cat "$RUNNER_TEMP/out/precheck.txt"
          spec=$(sed -n 's/^spec=//p' "$RUNNER_TEMP/out/precheck.txt")
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          {
            echo "### $BOARD at $SHA"
            echo '```'
            cat "$RUNNER_TEMP/out/precheck.txt" "$RUNNER_TEMP/out/validate.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -qx 'result=match' "$RUNNER_TEMP/out/precheck.txt" || ((validate)); then
            echo "::error::$BOARD: the plan does not match the checked-out board or fails --validate; replan before running"
            echo "precheck" > "$RUNNER_TEMP/out/status.txt"
            exit 1
          fi

      - name: Install pinned numerical dependencies
        run: python -m pip install -r scripts/pcbgen/numerical-requirements.txt

      - name: Pull the pinned KiCad oracle and build the A* core
        run: |
          source scripts/kicad/pin.env
          docker pull --quiet "$KICAD_IMAGE"
          bash scripts/kicad/run.sh kicad-cli version
          python -c "from scripts.pcbgen.grid_router import native_astar; assert native_astar(), 'grid_astar.c did not compile'"

      - name: Run the transaction
        id: run
        # Below the job timeout so that the collect step still runs when this step is cut off: the receipt is
        # then reconciled with an unknown exit status (nonterminal, terminal_outcome UNKNOWN) and uploaded.
        timeout-minutes: 95
        env:
          SPEC: ${{ steps.precheck.outputs.spec }}
        run: |
          # A receipt committed on the plan branch must never be uploaded as this run's result.
          rm -f "$PLAN_DIR/$SPEC.json" "$PLAN_DIR/$SPEC-copper.json"
          (
            peak=0
            while sleep 5; do
              used=$(awk '/^MemTotal:/{t=$2} /^MemAvailable:/{a=$2} END{print t-a}' /proc/meminfo)
              ((used > peak)) && peak=$used && echo "$peak" > "$RUNNER_TEMP/out/memory-peak-kb.txt"
            done
          ) &
          sampler=$!
          # Same source as prepare: budgets.json on the checked-out plan commit, read by the driver itself.
          max=${MAX_MINUTES:-$(python "$PLAN_DIR/transaction.py" "$BOARD" --print-budget)}
          wrapper=$((max + WRAPPER_GRACE_MINUTES))
          printf 'max_minutes=%s\nwrapper_minutes=%s\nkill_after_minutes=%s\ninvocation=%s\n' "$max" "$wrapper" "$KILL_AFTER_MINUTES" "$INVOCATION" | tee "$RUNNER_TEMP/out/budget.txt"
          set +e
          # The OSC4 README command with the runner's python; with_route_guard.sh execs it directly on github-hosted runners.
          # The driver stops itself at --max-minutes and finalises its receipt; the wrapper is the backstop behind it.
          # TERM, not INT: on the ubuntu-26.04 image `timeout --signal=INT` SIGKILLs the child at once (exit 137,
          # receipt left RUNNING; run 42412490176, reproduced by scripts/checks/test_osc4_transaction_signals.py in
          # run 42490037580), while --signal=TERM is delivered and honoured. The driver handles both the same way.
          bash scripts/pcbgen/with_route_guard.sh timeout --signal=TERM --kill-after="${KILL_AFTER_MINUTES}m" "${wrapper}m" \
            python -u "$PLAN_DIR/transaction.py" "$BOARD" --max-minutes "$max" --invocation "$INVOCATION" 2>&1 | tee "$RUNNER_TEMP/out/run.log"
          status=${PIPESTATUS[0]}
          set -e
          kill "$sampler" || true
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "$status" > "$RUNNER_TEMP/out/status.txt"

      - name: Collect receipts, candidate workspaces and the manifest
        if: always() && steps.precheck.outputs.spec != ''
        env:
          SPEC: ${{ steps.precheck.outputs.spec }}
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          out="$RUNNER_TEMP/out";mkdir -p "$out/receipts" "$out/workspaces"
          # Receipts only from a run that started (the run step deleted any committed copy first). With no exit
          # status (the run step was cut off by its timeout or cancelled) an existing receipt is still collected:
          # reconcile leaves it nonterminal with terminal_outcome UNKNOWN.
          receipt_note="not run"
          if [[ -n $STATUS || -f $PLAN_DIR/$SPEC.json ]]; then
            # A receipt the driver left nonterminal gets its terminal state from the exit status the shell saw
            # (INTERRUPTED / TIMED OUT / KILLED; OUTCOME UNKNOWN / ERROR); a terminal receipt is kept as is;
            # a receipt from another invocation is refused (exit 4) and not uploaded as this run's result.
            # --force-reconcile-corrupt: the committed copy was deleted before the run, so unreadable bytes are
            # this run's partial write; they are preserved in the raw-events file.
            set +e
            python -u "$PLAN_DIR/transaction.py" "$BOARD" --reconcile --exit-status "${STATUS:-unknown}" --invocation "$INVOCATION" --force-reconcile-corrupt | tee "$out/reconcile.json"
            reconcile=${PIPESTATUS[0]}
            set -e
            if ((reconcile == 0)); then
              for f in "$PLAN_DIR/$SPEC.json" "$PLAN_DIR/$SPEC-copper.json" "$PLAN_DIR/$SPEC.raw-events.jsonl"; do
                [[ -f $f ]] && cp "$f" "$out/receipts/"
              done
              receipt_note="invocation $INVOCATION verified; exit status ${STATUS:-unknown}"
            else
              receipt_note="receipt NOT collected: reconcile exit $reconcile (invocation mismatch or error)"
              echo "::error::$BOARD: $receipt_note"
            fi
          fi
          budget=$((WORKSPACE_BUDGET_MB * 1024 * 1024));total=0;: > "$out/excluded.txt"
          # Final fresh copy first, then every checked candidate (-verify, including a -stitch-verify).
          mapfile -t dirs < <(ls -d ".circuit-cache/$BOARD-grid-$SPEC"*-fresh ".circuit-cache/$BOARD-grid-$SPEC"*-verify 2>/dev/null || true)
          for d in "${dirs[@]}"; do
            for f in "$d"/*.kicad_pcb "$d/dump.json" "$d/drc.json"; do
              [[ -f $f ]] || continue
              size=$(stat -c %s "$f")
              if ((total + size > budget)); then echo "$f $size" >> "$out/excluded.txt";continue;fi
              mkdir -p "$out/workspaces/${d##*/}";cp "$f" "$out/workspaces/${d##*/}/";total=$((total + size))
            done
          done
          (cd "$out" && find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256)
          {
            echo "- exit status: ${STATUS:-not run}; peak host memory: $(( $(cat "$out/memory-peak-kb.txt" 2>/dev/null || echo 0) / 1024 )) MB"
            echo "- budget: $(tr '\n' ' ' < "$out/budget.txt" 2>/dev/null || echo 'not run')"
            echo "- receipts: $(ls "$out/receipts" | tr '\n' ' ') ($receipt_note)"
            echo "- workspace files uploaded: $((total / 1024 / 1024)) MB of a ${WORKSPACE_BUDGET_MB} MB budget"
            if [[ -s $out/excluded.txt ]]; then echo "- excluded (over budget):";sed 's/^/  - /' "$out/excluded.txt";fi
            if [[ -f $out/receipts/$SPEC.json ]]; then
              python -c "import json,sys;r=json.load(open(sys.argv[1]));print('- receipt:',r.get('status'),'| terminal_outcome:',r.get('terminal_outcome'),'| raw_gate_passed:',r.get('raw_gate_passed'),'| open edges:',r.get('open_edges_before'),'->',r.get('open_edges_after'),'| last phase:',r.get('phase'),'| signals:',[s.get('name') for s in r.get('signals',[])])" "$out/receipts/$SPEC.json"
            fi
            grep -E 'open edges|rejected|Error|error' "$out/run.log" 2>/dev/null | tail -n 20 | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the transaction artifact
        if: always() && steps.precheck.outputs.spec != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transaction-${{ matrix.board }}-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

      - name: Fail on a transaction error
        if: steps.run.outputs.status != '' && steps.run.outputs.status != '0'
        env:
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          echo "::error::transaction.py exited with status $STATUS (whatever it wrote is in the artifact)"
          exit 1
