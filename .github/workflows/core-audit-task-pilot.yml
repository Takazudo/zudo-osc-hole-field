name: Reviewed core audit task pilot
on:
  workflow_dispatch:
    inputs:
      core_audit_task_mode:
        description: Reviewed before wave or read-only geometry bootstrap; pilot is completed
        type: choice
        options: [pilot, before-wave, geometry-bootstrap]
        default: pilot
      core_audit_wave:
        description: Fixed before-stage wave index0–4
        type: string
        default: '0'
      core_audit_resume:
        description: Authenticated approvals for fully reconciled preceding waves
        type: string
        default: '[]'
      reviewed_commit:
        description: Exact source commit explicitly reviewed for this one pilot
        required: true
        type: string
      reviewed_manifest_sha256:
        description: Reviewed manifest file digest
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: issue189-core-audit-task-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify explicit reviewed source and manifest
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          REVIEWED_MANIFEST: ${{ inputs.reviewed_manifest_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib,os,subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['REVIEWED_COMMIT']
          assert hashlib.sha256(Path('circuit/routing/issue189/core236-task-checkpoints/manifest.json').read_bytes()).hexdigest()==os.environ['REVIEWED_MANIFEST']
          PY
      - name: Authenticate and prepare immutable inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_JSON: ${{ inputs.core_audit_resume }}
        run: python3 scripts/pcbgen/core_audit_pilot.py prepare --output .circuit-cache/core-task-inputs --resume-json "$RESUME_JSON"
      - name: Reviewed wave or read-only bootstrap under one shared forty-minute budget
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          AUDIT_MODE: ${{ inputs.core_audit_task_mode }}
          AUDIT_WAVE: ${{ inputs.core_audit_wave }}
          RESUME_JSON: ${{ inputs.core_audit_resume }}
        run: |
          timeout --signal=INT --kill-after=30s 40m python3 scripts/pcbgen/core_audit_pilot.py controller --source-root .circuit-cache/core-task-inputs --config circuit/routing/issue189/core236-task-checkpoints --output .circuit-cache/core-task-output --reviewed-commit "$REVIEWED_COMMIT" --mode "$AUDIT_MODE" --wave "$AUDIT_WAVE" --resume-json "$RESUME_JSON"
      - name: Preserve all completed and partial checkpoints on every exit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-audit-task-pilot-${{ github.run_id }}
          path: .circuit-cache/core-task-output/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
