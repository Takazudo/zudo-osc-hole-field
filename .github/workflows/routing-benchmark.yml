name: Routing obstacle benchmark
run-name: Issue 189 identical-input obstacle benchmark
on:
  pull_request:
    paths:
      - '.github/workflows/routing-benchmark.yml'
      - 'scripts/pcbgen/benchmark_obstacles.py'
  workflow_dispatch:
    inputs:
      board:
        type: choice
        options: [osc-jack-left, osc-jack-right, osc-core]
        required: true
permissions:
  contents: read
concurrency:
  group: obstacle-benchmark-${{ github.ref }}-${{ inputs.board }}
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(inputs.board && format('["{0}"]', inputs.board) || '["osc-jack-left","osc-jack-right","osc-core"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - run: python -m pip install -r scripts/pcbgen/numerical-requirements.txt
      - name: Compare old and corrected routers on identical saved inputs
        env:
          BOARD: ${{ matrix.board }}
        run: |
          mkdir -p .circuit-cache
          set -o pipefail
          timeout --signal=INT --kill-after=2m 90m python -u scripts/pcbgen/benchmark_obstacles.py "$BOARD" 2>&1 | tee .circuit-cache/benchmark.log
      - name: Preserve inputs, negative results, proposals and native receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: obstacle-benchmark-${{ matrix.board }}-${{ github.run_id }}
          path: |
            .circuit-cache/issue189-*/
            .circuit-cache/benchmark.log
          retention-days: 30
          if-no-files-found: error
