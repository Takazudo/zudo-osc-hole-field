name: Routing obstacle benchmark
run-name: "Issue 189 ${{ inputs.local_repair && 'read-only local repair' || inputs.recover_core && 'core return repair' || (inputs.adopt_run || inputs.replay_jl || inputs.replay_jr) && 'copper adoption' || 'same-input benchmark' }} — ${{ inputs.board }}"
on:
  workflow_dispatch:
    inputs:
      board:
        type: choice
        options: [osc-jack-left, osc-jack-right, osc-core]
        required: true
      adopt_run:
        description: Optional completed benchmark run ID to replay and natively recheck before adoption
        type: string
        required: false
      replay_jl:
        description: Replay a fixed native-eligible JL transaction through full adoption gates
        type: boolean
        default: false
      replay_jr:
        description: Replay a reviewed JR transaction through full native adoption gates
        type: boolean
        default: false
      jr_replay:
        description: Fixed reviewed JR transaction (used only with replay_jr)
        type: choice
        options: [return-restored, original-ground, u7509-on-ground, rail-finer, two-on-supply, bounded-one, bounded-two, three-compatible]
        default: return-restored
      jl_replay:
        description: Fixed native-eligible JL transaction (used only with replay_jl)
        type: choice
        options: [rail-leaf, corridor, paired-corridors, ground-junction, rail-finer, d2326]
        default: rail-leaf
      recover_core:
        description: Replay the preserved core aggregate and repair split AGND before the full native gate
        type: boolean
        default: false
      core_replay:
        description: Reviewed recovery transaction (used only with recover_core)
        type: choice
        options: [aggregate, reviewed, outer, outer-filtered, ground-link, bounded-one]
        default: aggregate
      local_repair:
        description: Read-only jack local branch-repair pilot (no canonical writer)
        type: boolean
        default: false
      local_mode:
        description: Local cut pilot, or fixed jack signal proposal with native supply restoration
        type: choice
        options: [cut, coupled]
        default: cut
permissions:
  contents: read
concurrency:
  group: obstacle-benchmark-${{ github.ref }}-${{ inputs.board }}
  cancel-in-progress: false
jobs:
  benchmark:
    if: inputs.adopt_run == '' && !inputs.recover_core && !inputs.replay_jl && !inputs.replay_jr && !inputs.local_repair
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(inputs.board && format('["{0}"]', inputs.board) || '["osc-jack-left","osc-jack-right","osc-core"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - run: python -m pip install -r scripts/pcbgen/numerical-requirements.txt
      - name: Compare old and corrected routers on identical saved inputs
        env:
          BOARD: ${{ matrix.board }}
        run: |
          mkdir -p .circuit-cache
          set -o pipefail
          # Core's measured native refill takes nine minutes; keep the routing
          # search budget fixed but allow its mandatory settled/fresh checks.
          budget=90
          [[ $BOARD == osc-core ]] && budget=335
          timeout --signal=INT --kill-after=2m "${budget}m" python -u scripts/pcbgen/benchmark_obstacles.py "$BOARD" 2>&1 | tee .circuit-cache/benchmark.log
      - name: Preserve inputs, negative results, proposals and native receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: obstacle-benchmark-${{ matrix.board }}-${{ github.run_id }}
          path: |
            .circuit-cache/issue189-*/
            .circuit-cache/benchmark.log
            .circuit-cache/*-grid-189-*/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
  adopt:
    if: (inputs.adopt_run != '' || inputs.recover_core || inputs.replay_jl || inputs.replay_jr) && !inputs.local_repair
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: read
    concurrency:
      group: route-${{ inputs.board }}-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      BOARD: ${{ inputs.board }}
      BENCHMARK_RUN: ${{ inputs.adopt_run }}
      RECOVER_CORE: ${{ inputs.recover_core }}
      CORE_REPLAY: ${{ inputs.core_replay }}
      REPLAY_JR: ${{ inputs.replay_jr }}
      JR_REPLAY: ${{ inputs.jr_replay }}
      REPLAY_JL: ${{ inputs.replay_jl }}
      JL_REPLAY: ${{ inputs.jl_replay }}
    steps:
      - name: Restrict adoption to the isolated issue branch
        run: |
          [[ $GITHUB_REF_NAME == agent-fix/189-* ]] || exit 1
          if [[ $REPLAY_JR == true ]]; then
            [[ $BOARD == osc-jack-right && -z $BENCHMARK_RUN && $RECOVER_CORE == false && $REPLAY_JL == false ]] || exit 1
          elif [[ $REPLAY_JL == true ]]; then
            [[ $BOARD == osc-jack-left && -z $BENCHMARK_RUN && $RECOVER_CORE == false ]] || exit 1
          elif [[ $RECOVER_CORE == true ]]; then
            [[ $BOARD == osc-core && -z $BENCHMARK_RUN ]] || exit 1
          else
            [[ $BENCHMARK_RUN =~ ^[0-9]+$ ]] || exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - run: python -m pip install -r scripts/pcbgen/numerical-requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.adopt_run != ''
        with:
          name: obstacle-benchmark-${{ inputs.board }}-${{ inputs.adopt_run }}
          run-id: ${{ inputs.adopt_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .circuit-cache/benchmark-download
      - name: Replay eligible copper and recheck native connectivity
        if: inputs.adopt_run != ''
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=2m 335m python -u scripts/pcbgen/adopt_obstacle_benchmark.py \
            ".circuit-cache/benchmark-download/issue189-$BOARD" --promote \
            2>&1 | tee .circuit-cache/adoption.log
      - name: Replay fixed native-eligible JL copper
        if: inputs.replay_jl
        run: |
          mkdir -p .circuit-cache
          set -o pipefail
          if [[ $JL_REPLAY == paired-corridors ]]; then
            python circuit/routing/issue189/jl-paired-corridors-prepare.py
            replay=circuit/routing/issue189/jl-paired-corridors-copper.json
            label=issue189-paired-corridors
          elif [[ $JL_REPLAY == corridor ]]; then
            replay=circuit/routing/issue189/jl-corridor-copper.json
            label=issue189-corridor
          elif [[ $JL_REPLAY == rail-leaf ]]; then
            replay=circuit/routing/issue189/jl-rail-leaf-copper.json
            label=issue189-rail-leaf
          elif [[ $JL_REPLAY == ground-junction ]]; then
            replay=circuit/routing/issue189/jl-ground-junction-copper.json
            label=issue189-ground-junction
          elif [[ $JL_REPLAY == rail-finer ]]; then
            replay=circuit/routing/issue189/jl-rail-finer-copper.json
            label=issue189-rail-finer
          elif [[ $JL_REPLAY == d2326 ]]; then
            replay=circuit/routing/issue189/jl-d2326-copper.json
            label=issue189-d2326
          else
            exit 1
          fi
          timeout --signal=INT --kill-after=2m 80m python -u scripts/pcbgen/route_shards.py merge osc-jack-left \
            "$replay" --label "$label" \
            2>&1 | tee .circuit-cache/adoption.log
      - name: Replay reviewed JR copper through the native gate
        if: inputs.replay_jr
        run: |
          mkdir -p .circuit-cache
          set -o pipefail
          case "$JR_REPLAY" in
            return-restored|original-ground|u7509-on-ground|rail-finer|two-on-supply|bounded-one|bounded-two|three-compatible) ;;
            *) exit 1 ;;
          esac
          replay="circuit/routing/issue189/jr-${JR_REPLAY}-copper.json"
          if [[ $JR_REPLAY == bounded-one || $JR_REPLAY == bounded-two || $JR_REPLAY == three-compatible ]]; then
            python "circuit/routing/issue189/jr-${JR_REPLAY}/prepare.py"
            replay=".circuit-cache/issue189-jr-${JR_REPLAY}/copper.json"
          fi
          timeout --signal=INT --kill-after=2m 80m python -u scripts/pcbgen/route_shards.py merge osc-jack-right \
            "$replay" --label "issue189-${JR_REPLAY}" \
            2>&1 | tee .circuit-cache/adoption.log
      - name: Recover preserved core copper and repair split returns
        if: inputs.recover_core
        run: |
          mkdir -p .circuit-cache
          set -o pipefail
          if [[ $CORE_REPLAY == reviewed ]]; then
            python circuit/routing/issue189/core-reviewed/prepare.py
            replay=circuit/routing/issue189/core-reviewed/copper.json
            label=issue189-reviewed
            extra=()
          elif [[ $CORE_REPLAY == outer ]]; then
            python circuit/routing/issue189/core-outer/prepare.py
            replay=circuit/routing/issue189/core-outer/copper.json
            label=issue189-outer
            extra=()
          elif [[ $CORE_REPLAY == ground-link ]]; then
            python circuit/routing/issue189/core-ground-link/prepare.py
            replay=.circuit-cache/issue189-core-ground-link/copper.json
            label=issue189-ground-link
            extra=()
          elif [[ $CORE_REPLAY == bounded-one ]]; then
            python circuit/routing/issue189/core-bounded-one/prepare.py
            replay=.circuit-cache/issue189-core-bounded-one/copper.json
            label=issue189-bounded-one
            extra=()
          elif [[ $CORE_REPLAY == outer-filtered ]]; then
            replay=circuit/routing/issue189/core-outer-filtered/copper.json
            label=issue189-outer-filtered
            extra=()
          elif [[ $CORE_REPLAY == aggregate ]]; then
            replay=circuit/routing/issue189/concurrent-core/aggregate-copper.json
            label=issue189-recovered
            extra=(--repair-ground)
          else
            exit 1
          fi
          timeout --signal=INT --kill-after=2m 335m python -u scripts/pcbgen/route_shards.py merge osc-core \
            "$replay" --label "$label" "${extra[@]}" 2>&1 | tee .circuit-cache/adoption.log
      - name: Push accepted draft copper with replay and native receipts
        run: |
          message=$(mktemp)
          echo "Record native-rechecked $BOARD copper (benchmark $BENCHMARK_RUN, recovered core $RECOVER_CORE)" > "$message"
          bash scripts/pcbgen/ci_push_route.sh "$BOARD" "$GITHUB_REF_NAME" "$message"
      - name: Retain native acceptance and rejected candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: obstacle-adoption-${{ inputs.board }}-${{ github.run_id }}
          path: |
            .circuit-cache/*-grid-189-*/
            .circuit-cache/*-189-adoption.json
            .circuit-cache/adoption.log
            .circuit-cache/*-grid-shards-*/
            boards/${{ inputs.board }}/reports/grid-routing/
          include-hidden-files: true
          retention-days: 30
  local-pilot:
    if: inputs.local_repair && !inputs.replay_jl && !inputs.replay_jr
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      BOARD: ${{ inputs.board }}
      ADOPT_RUN: ${{ inputs.adopt_run }}
      RECOVER_CORE: ${{ inputs.recover_core }}
      LOCAL_MODE: ${{ inputs.local_mode }}
    steps:
      - name: Require a read-only jack request
        run: '[[ ( $BOARD == osc-jack-left || $BOARD == osc-jack-right ) && -z $ADOPT_RUN && $RECOVER_CORE == false ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - run: python -m pip install -r scripts/pcbgen/numerical-requirements.txt
      - name: Check the local cut and reroute with native topology
        run: |
          mkdir -p .circuit-cache
          set -o pipefail
          args=(--board "$BOARD")
          if [[ $LOCAL_MODE == coupled ]]; then
            args+=(--coupled)
          elif [[ $LOCAL_MODE != cut ]]; then
            exit 1
          fi
          timeout --signal=INT --kill-after=2m 80m python -u scripts/pcbgen/local_repair_pilot.py "${args[@]}" \
            2>&1 | tee .circuit-cache/local-repair.log
      - name: Retain local proposal and native rejection or eligibility
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: obstacle-local-${{ inputs.board }}-${{ github.run_id }}
          path: |
            .circuit-cache/issue189-local-${{ inputs.board }}/
            .circuit-cache/${{ inputs.board }}-grid-189-local-base/
            .circuit-cache/${{ inputs.board }}-grid-189-j*/
            .circuit-cache/local-repair.log
          include-hidden-files: true
          retention-days: 30
