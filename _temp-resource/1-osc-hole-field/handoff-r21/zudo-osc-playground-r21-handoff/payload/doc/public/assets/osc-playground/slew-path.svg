<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="590" viewBox="0 0 1340 590"><rect width="1340" height="590" fill="#101413"/><text x="35" y="44" fill="#ecece3" font-size="26" text-anchor="start" font-family="DejaVu Sans, sans-serif">S&amp;H + SLEW / separate capture and glide</text><text x="35" y="76" fill="#8f968e" font-size="15" text-anchor="start" font-family="DejaVu Sans, sans-serif">R21 implementation proposal — same three jacks, one SAMPLE button and one SLEW pot per cell</text><rect x="35" y="190" width="178" height="93" rx="6" fill="#1a201d" stroke="#c6a35e" stroke-width="1.5"/><text x="124.0" y="225" fill="#ecece3" font-size="18" text-anchor="middle" font-family="DejaVu Sans, sans-serif">IN → S&amp;H</text><text x="124.0" y="254" fill="#8f968e" font-size="15" text-anchor="middle" font-family="DejaVu Sans, sans-serif">LF398 + C_HOLD</text><rect x="285" y="190" width="150" height="93" rx="6" fill="#1a201d" stroke="#c6a35e" stroke-width="1.5"/><text x="360.0" y="225" fill="#ecece3" font-size="18" text-anchor="middle" font-family="DejaVu Sans, sans-serif">RAW_HELD</text><text x="360.0" y="254" fill="#8f968e" font-size="15" text-anchor="middle" font-family="DejaVu Sans, sans-serif">unity buffer</text><rect x="505" y="190" width="250" height="93" rx="6" fill="#1a201d" stroke="#c6a35e" stroke-width="1.5"/><text x="630.0" y="225" fill="#ecece3" font-size="18" text-anchor="middle" font-family="DejaVu Sans, sans-serif">2.2 kΩ + SLEW</text><text x="630.0" y="254" fill="#8f968e" font-size="15" text-anchor="middle" font-family="DejaVu Sans, sans-serif">0…500 kΩ rheostat</text><rect x="833" y="190" width="182" height="93" rx="6" fill="#1a201d" stroke="#c6a35e" stroke-width="1.5"/><text x="924.0" y="225" fill="#ecece3" font-size="18" text-anchor="middle" font-family="DejaVu Sans, sans-serif">V_SLEW</text><text x="924.0" y="254" fill="#8f968e" font-size="15" text-anchor="middle" font-family="DejaVu Sans, sans-serif">separate RC node</text><rect x="1091" y="190" width="210" height="93" rx="6" fill="#1a201d" stroke="#c6a35e" stroke-width="1.5"/><text x="1196.0" y="225" fill="#ecece3" font-size="18" text-anchor="middle" font-family="DejaVu Sans, sans-serif">output buffer</text><text x="1196.0" y="254" fill="#8f968e" font-size="15" text-anchor="middle" font-family="DejaVu Sans, sans-serif">→ existing OUT</text><path d="M213 237L285 237" stroke="#c6a35e" stroke-width="2" fill="none"/><path d="M276 232L285 237L276 242" stroke="#c6a35e" fill="none" stroke-width="2"/><path d="M435 237L505 237" stroke="#c6a35e" stroke-width="2" fill="none"/><path d="M496 232L505 237L496 242" stroke="#c6a35e" fill="none" stroke-width="2"/><path d="M755 237L833 237" stroke="#c6a35e" stroke-width="2" fill="none"/><path d="M824 232L833 237L824 242" stroke="#c6a35e" fill="none" stroke-width="2"/><path d="M1015 237L1091 237" stroke="#c6a35e" stroke-width="2" fill="none"/><path d="M1082 232L1091 237L1082 242" stroke="#c6a35e" fill="none" stroke-width="2"/><rect x="35" y="109" width="255" height="48" rx="6" fill="#1a201d" stroke="#c6a35e" stroke-width="1.5"/><text x="162" y="139" fill="#ecece3" font-size="15" text-anchor="middle" font-family="DejaVu Sans, sans-serif">TRIGGER → acquisition pulse</text><path d="M130 157L130 190" stroke="#c6a35e" stroke-width="2" fill="none"/><path d="M924 283L924 320" stroke="#c6a35e" stroke-width="2" fill="none"/><path d="M903 320L945 320" stroke="#c6a35e" stroke-width="2" fill="none"/><path d="M903 331L945 331" stroke="#c6a35e" stroke-width="2" fill="none"/><path d="M924 331L924 357" stroke="#c6a35e" stroke-width="2" fill="none"/><path d="M907 357L941 357" stroke="#c6a35e" stroke-width="2" fill="none"/><path d="M913 364L935 364" stroke="#c6a35e" stroke-width="2" fill="none"/><text x="924" y="395" fill="#ecece3" font-size="17" text-anchor="middle" font-family="DejaVu Sans, sans-serif">C_SLEW = 0.50 µF</text><text x="924" y="420" fill="#8f968e" font-size="14" text-anchor="middle" font-family="DejaVu Sans, sans-serif">5 × 100 nF C0G, proposed</text><text x="1196" y="324" fill="#ecece3" font-size="15" text-anchor="middle" font-family="DejaVu Sans, sans-serif">OUT magnitude LED</text><path d="M1196 283L1196 302" stroke="#c6a35e" stroke-width="2" fill="none"/><text x="35" y="340" fill="#c6a35e" font-size="19" text-anchor="start" font-family="DejaVu Sans, sans-serif">Do not attach SLEW or the LED to the LF398 hold-capacitor pin.</text><text x="35" y="378" fill="#ecece3" font-size="17" text-anchor="start" font-family="DejaVu Sans, sans-serif">One pot shapes both directions. FAST still has a small finite lag.</text><text x="35" y="413" fill="#8f968e" font-size="16" text-anchor="start" font-family="DejaVu Sans, sans-serif">No added bypass switch, raw-output jack, CV input or internal noise normal.</text><text x="35" y="477" fill="#c6a35e" font-size="21" text-anchor="start" font-family="DejaVu Sans, sans-serif">Nominal τ = 1.1…251.1 ms     •     5 V step to 10 mV at maximum ≈ 1.56 s</text><text x="35" y="515" fill="#ecece3" font-size="17" text-anchor="start" font-family="DejaVu Sans, sans-serif">Keep the pot, lag capacitor and buffers together. Route only buffered signals between boards.</text><text x="35" y="551" fill="#8f968e" font-size="15" text-anchor="start" font-family="DejaVu Sans, sans-serif">A practical starting circuit, not an ADDAC215 schematic clone or a precision-hold performance claim.</text></svg>