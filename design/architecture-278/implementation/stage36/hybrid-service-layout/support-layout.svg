<text x="25" y="380" font-size="16" fill="#253235">Control: new lower rails x203–206 /231–234; bridge y306–310;</text>
<text x="25" y="405" font-size="16" fill="#253235">crossmember y314–320; new cleat(315,317). Z18–20.</text>
<text x="25" y="435" font-size="16" fill="#253235">Fasteners(213,308)/(224,308) through bridge; posts6.4.</text>
<text x="25" y="465" font-size="16" fill="#253235">2 mm nominal tab-to-bottom-crossmember XY gap.</text>
<text x="25" y="505" font-size="16" fill="#253235">Middle: two8×4 mm stock crossbars y176–184 /270–278,</text>
<text x="25" y="530" font-size="16" fill="#253235">x242–314,z44.4–48.4;1.6-deep seats cut into old rails.</text>
<text x="25" y="560" font-size="16" fill="#253235">Four24 mm M3 spacers at(254/300,180/274).</text>
<text x="25" y="635" font-size="16" fill="#253235">Header mating view: key −Y, odd pins on −Y row, pin1 at left. Socket face: reverse Y, preserve X.</text>
<text x="25" y="665" font-size="16" fill="#253235">Keep original1–6 C-SIG,1–4 J-PWR,1–7 J-SIG; extra pins NC. J-PWR includes+5; K-PWR does not.</text>
<text x="25" y="705" font-size="17" fill="#a65e42">Closed strain-relief/cable-exit height and neighbor seating datums remain required; do not infer free space.</text>
