<text x="20" y="490" font-size="15">Native board contains fixed connectors/test points missing from Stage39 report-only placement screen.</text>
<text x="20" y="522" font-size="15">All-rear bounded repacks failed; this explicit mixed-face candidate keeps amplifier and feedback parts together front.</text>
<text x="20" y="554" font-size="15">Private nets are classified from every native footprint pad owner, not opaque native net names.</text>
<text x="20" y="586" font-size="15">Shared rails/AGND and foreign copper are never bulk-deleted. Exact object occurrence+hash lists drive later review.</text>
<text x="20" y="618" font-size="15">Next: native disposable candidate, one complete cell/loop pilot; baseline ratsnest, pad parity, DRC, zones and foreign connectivity.</text>
<text x="20" y="650" font-size="15">No canonical PCB or copper changed. Native feasibility, return loops, optics, physical fit and protection remain unresolved.</text>
