<rect width="100%" height="100%" fill="#fff"/>
<text x="10" y="16" font-size="12" font-weight="bold">Stage34 arch-plane sections: RG34 channel, former, sleeves and free spans (installed)</text>
<text x="10" y="30">Unfolded section in each arch plane (s along the arch, z up). Light grey: RG34 block outline; dashed boxes: removable sleeves; dark grey: former at its nominal set height (dotted: lowest setting); thick line: cap.</text>
<text x="10" y="42">Dashed ellipses: free-span reach (all slack in one span, inflated). The cable may touch the walls, former and cap; it cannot leave the channel.</text>
