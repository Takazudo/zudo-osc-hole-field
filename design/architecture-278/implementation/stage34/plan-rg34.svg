<text x="10" y="16" font-size="12" font-weight="bold">Stage34 R33 + RG34 plan (design study; modelled envelopes, not physical clearance)</text>
<text x="10" y="30">Blue J-SIG, red J-PWR: arch centrelines (installed). Filled outlines: RG34 channels and sleeves (outer walls). Dark: post on crossmember:rear:0. Dashed black: core box with the 40 mm withdrawal.</text>
<text x="10" y="42">Circles: free-span reach (spheroid semi-minor + inflation) at each housing exit. Grey: designed parts above z 40; dotted: screwdriver columns.</text>
